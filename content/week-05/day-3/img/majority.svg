<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A five node cluster partitioned three against two, and only the majority side can elect a leader">
  <rect width="760" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Why a majority: two majorities cannot exist at once</text>

  <rect x="40" y="58" width="300" height="150" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="190" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#166534">three nodes &#8212; a majority of five</text>
  <g font-family="system-ui,sans-serif" font-size="12">
    <circle cx="105" cy="130" r="22" fill="#22c55e" stroke="#16a34a"/><text x="105" y="135" text-anchor="middle" fill="#fff" font-weight="700">L</text>
    <circle cx="190" cy="130" r="22" fill="#fff" stroke="#86efac"/><text x="190" y="135" text-anchor="middle" fill="#166534">B</text>
    <circle cx="275" cy="130" r="22" fill="#fff" stroke="#86efac"/><text x="275" y="135" text-anchor="middle" fill="#166534">C</text>
  </g>
  <text x="190" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#166534">elects a leader, accepts writes</text>
  <text x="190" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#166534">carries on</text>

  <g stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"><path d="M380 50 V240"/></g>
  <text x="380" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c" font-weight="600">the partition</text>

  <rect x="420" y="58" width="300" height="150" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="570" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#991b1b">two nodes &#8212; not a majority</text>
  <g font-family="system-ui,sans-serif" font-size="12">
    <circle cx="525" cy="130" r="22" fill="#fff" stroke="#fca5a5"/><text x="525" y="135" text-anchor="middle" fill="#991b1b">D</text>
    <circle cx="615" cy="130" r="22" fill="#fff" stroke="#fca5a5"/><text x="615" y="135" text-anchor="middle" fill="#991b1b">E</text>
  </g>
  <text x="570" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">cannot elect. Refuses writes.</text>
  <text x="570" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Unavailable, and correct.</text>

  <rect x="40" y="234" width="680" height="46" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="56" y="254" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">Any two majorities of the same set must share a node, and that node will not vote twice in one term.</text>
  <text x="56" y="270" font-family="system-ui,sans-serif" font-size="11" fill="#334155">The minority side going unavailable is not a bug being tolerated. It is the guarantee being kept.</text>
</svg>
