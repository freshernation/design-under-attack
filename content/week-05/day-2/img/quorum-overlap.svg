<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Write and read quorums overlapping, and failing to overlap">
  <rect width="760" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">W + R &gt; N — the whole idea is that the sets must touch</text>

  <text x="30" y="62" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#15803d">N=5, W=3, R=3 &#8212; they overlap</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <g fill="#dcfce7" stroke="#22c55e">
      <circle cx="60" cy="110" r="18"/><circle cx="108" cy="110" r="18"/><circle cx="156" cy="110" r="18"/>
    </g>
    <g fill="#fff" stroke="#cbd5e1">
      <circle cx="204" cy="110" r="18"/><circle cx="252" cy="110" r="18"/>
    </g>
    <g fill="#166534"><text x="60" y="114" text-anchor="middle">A</text><text x="108" y="114" text-anchor="middle">B</text><text x="156" y="114" text-anchor="middle">C</text></g>
    <g fill="#94a3b8"><text x="204" y="114" text-anchor="middle">D</text><text x="252" y="114" text-anchor="middle">E</text></g>
    <text x="30" y="150" fill="#166534">write went to A B C</text>

    <g fill="#fff" stroke="#cbd5e1"><circle cx="60" cy="188" r="18"/><circle cx="108" cy="188" r="18"/></g>
    <g fill="#dbeafe" stroke="#60a5fa"><circle cx="156" cy="188" r="18"/><circle cx="204" cy="188" r="18"/><circle cx="252" cy="188" r="18"/></g>
    <g fill="#94a3b8"><text x="60" y="192" text-anchor="middle">A</text><text x="108" y="192" text-anchor="middle">B</text></g>
    <g fill="#1e3a8a"><text x="156" y="192" text-anchor="middle">C</text><text x="204" y="192" text-anchor="middle">D</text><text x="252" y="192" text-anchor="middle">E</text></g>
    <text x="30" y="228" fill="#1e3a8a">read asks C D E</text>
  </g>
  <rect x="138" y="88" width="36" height="122" rx="6" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="156" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#92400e" font-weight="600">C is in both</text>
  <text x="156" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">so the read sees the write</text>

  <line x1="330" y1="46" x2="330" y2="284" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <text x="360" y="62" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#b91c1c">N=5, W=2, R=2 &#8212; they need not</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <g fill="#fee2e2" stroke="#ef4444"><circle cx="390" cy="110" r="18"/><circle cx="438" cy="110" r="18"/></g>
    <g fill="#fff" stroke="#cbd5e1"><circle cx="486" cy="110" r="18"/><circle cx="534" cy="110" r="18"/><circle cx="582" cy="110" r="18"/></g>
    <g fill="#991b1b"><text x="390" y="114" text-anchor="middle">A</text><text x="438" y="114" text-anchor="middle">B</text></g>
    <g fill="#94a3b8"><text x="486" y="114" text-anchor="middle">C</text><text x="534" y="114" text-anchor="middle">D</text><text x="582" y="114" text-anchor="middle">E</text></g>
    <text x="360" y="150" fill="#991b1b">write went to A B</text>

    <g fill="#fff" stroke="#cbd5e1"><circle cx="390" cy="188" r="18"/><circle cx="438" cy="188" r="18"/><circle cx="486" cy="188" r="18"/></g>
    <g fill="#fee2e2" stroke="#ef4444"><circle cx="534" cy="188" r="18"/><circle cx="582" cy="188" r="18"/></g>
    <g fill="#94a3b8"><text x="390" y="192" text-anchor="middle">A</text><text x="438" y="192" text-anchor="middle">B</text><text x="486" y="192" text-anchor="middle">C</text></g>
    <g fill="#991b1b"><text x="534" y="192" text-anchor="middle">D</text><text x="582" y="192" text-anchor="middle">E</text></g>
    <text x="360" y="228" fill="#991b1b">read asks D E</text>
  </g>
  <text x="486" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b" font-weight="600">no node in both</text>
  <text x="486" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">the read returns the old value, confidently</text>
</svg>
