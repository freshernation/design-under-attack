<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="A ladder of consistency models from linearizable down to eventual, with what each costs">
  <rect width="760" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Stronger upwards. Available under partition, downwards.</text>

  <g font-family="system-ui,sans-serif" font-size="12">
    <g>
      <rect x="40" y="52" width="480" height="38" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="56" y="76" font-weight="700" fill="#991b1b">Linearizable</text>
      <text x="200" y="76" fill="#334155">one global order, and it matches real time</text>
      <text x="536" y="76" fill="#991b1b">majority round trip</text>
    </g>
    <g>
      <rect x="40" y="98" width="480" height="38" rx="5" fill="#ffedd5" stroke="#fdba74"/>
      <text x="56" y="122" font-weight="700" fill="#9a3412">Sequential</text>
      <text x="200" y="122" fill="#334155">one global order, not necessarily real time</text>
      <text x="536" y="122" fill="#9a3412">still needs agreement</text>
    </g>
    <g>
      <rect x="40" y="144" width="480" height="38" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="56" y="168" font-weight="700" fill="#92400e">Causal</text>
      <text x="200" y="168" fill="#334155">what caused what is preserved</text>
      <text x="536" y="168" fill="#92400e">available under partition</text>
    </g>
    <g>
      <rect x="40" y="190" width="480" height="38" rx="5" fill="#dcfce7" stroke="#86efac"/>
      <text x="56" y="214" font-weight="700" fill="#166534">Session guarantees</text>
      <text x="200" y="214" fill="#334155">read-your-writes, monotonic reads</text>
      <text x="536" y="214" fill="#166534">nearly free</text>
    </g>
    <g>
      <rect x="40" y="236" width="480" height="38" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="56" y="260" font-weight="700" fill="#1e3a8a">Eventual</text>
      <text x="200" y="260" fill="#334155">the copies converge, some day</text>
      <text x="536" y="260" fill="#1e3a8a">free</text>
    </g>
  </g>

  <rect x="40" y="288" width="680" height="30" rx="5" fill="#fff" stroke="#cbd5e1"/>
  <text x="56" y="308" font-family="system-ui,sans-serif" font-size="11" fill="#334155">Most products need the fourth row and buy the first. The gap between those two is a majority round trip on every request.</text>
</svg>
