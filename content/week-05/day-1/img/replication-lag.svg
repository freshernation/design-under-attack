<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="A write acknowledged by the leader, and a read from a follower that has not received it yet">
  <rect width="760" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">&quot;I just saved it and it is not there&quot;</text>

  <g font-family="system-ui,sans-serif" font-size="11" fill="#475569">
    <text x="30" y="66">client</text>
    <text x="30" y="140">leader</text>
    <text x="30" y="214">follower</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <path d="M96 60 H720"/><path d="M96 134 H720"/><path d="M96 208 H720"/>
  </g>

  <g stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#w5a)">
    <path d="M140 60 L210 134"/>
    <path d="M210 134 L280 60"/>
  </g>
  <defs><marker id="w5a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2563eb"/></marker></defs>
  <text x="120" y="90" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#2563eb">write x=2</text>
  <text x="252" y="90" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#2563eb">ok</text>

  <g stroke="#94a3b8" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#w5b)">
    <path d="M215 134 L470 208"/>
  </g>
  <defs><marker id="w5b" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/></marker></defs>
  <text x="290" y="182" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">replicated, eventually &#8212; 180 ms of lag</text>

  <g stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#w5c)">
    <path d="M330 60 L390 208"/>
    <path d="M390 208 L450 60"/>
  </g>
  <defs><marker id="w5c" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#b91c1c"/></marker></defs>
  <text x="316" y="252" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#b91c1c">read x</text>
  <text x="444" y="252" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#b91c1c">x = 1</text>

  <rect x="30" y="268" width="700" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="46" y="288" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">Nothing failed. Every component did exactly what it was designed to do, and the user watched their own edit vanish.</text>
  <text x="46" y="304" font-family="system-ui,sans-serif" font-size="11" fill="#334155">Read-your-writes is the guarantee that fixes this, and it is far cheaper than making everything strongly consistent.</text>
</svg>
