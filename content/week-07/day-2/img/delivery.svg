<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Where the offset is committed decides the delivery guarantee">
  <rect width="760" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">One line moves, and the guarantee changes</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <rect x="30" y="54" width="340" height="120" rx="6" fill="#fff" stroke="#fca5a5"/>
    <text x="46" y="78" fill="#991b1b" font-weight="700" font-family="system-ui,sans-serif">At most once</text>
    <text x="46" y="102" fill="#334155">read(record)</text>
    <text x="46" y="122" fill="#b91c1c">commit(offset)</text>
    <text x="46" y="142" fill="#334155">process(record)</text>
    <text x="46" y="164" fill="#64748b" font-size="11" font-family="system-ui,sans-serif">crash between them &#8594; the record is lost</text>

    <rect x="390" y="54" width="340" height="120" rx="6" fill="#fff" stroke="#86efac"/>
    <text x="406" y="78" fill="#166534" font-weight="700" font-family="system-ui,sans-serif">At least once</text>
    <text x="406" y="102" fill="#334155">read(record)</text>
    <text x="406" y="122" fill="#334155">process(record)</text>
    <text x="406" y="142" fill="#15803d">commit(offset)</text>
    <text x="406" y="164" fill="#64748b" font-size="11" font-family="system-ui,sans-serif">crash between them &#8594; the record repeats</text>
  </g>

  <rect x="30" y="192" width="700" height="86" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="48" y="216" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#92400e">There is no third box</text>
  <text x="48" y="238" font-family="system-ui,sans-serif" font-size="11" fill="#334155">Exactly-once *delivery* is not available: the sender cannot tell &quot;you did not receive it&quot; from &quot;your reply was lost&quot;,</text>
  <text x="48" y="256" font-family="system-ui,sans-serif" font-size="11" fill="#334155">so it must choose between resending and not. What is available is exactly-once *effect* &#8212; deliver more than</text>
  <text x="48" y="274" font-family="system-ui,sans-serif" font-size="11" fill="#334155">once, and make the second delivery change nothing. That is Wednesday, and it is the whole of this week.</text>
</svg>
