<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="The dual write problem, and the outbox that removes it">
  <rect width="760" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Two writes, no transaction between them</text>

  <text x="30" y="62" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#b91c1c">The dual write</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="30" y="76" width="90" height="34" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="75" y="98" text-anchor="middle" fill="#334155">service</text>
    <rect x="30" y="140" width="90" height="34" rx="5" fill="#dbeafe" stroke="#93c5fd"/><text x="75" y="162" text-anchor="middle" fill="#1e3a8a">database</text>
    <rect x="200" y="140" width="90" height="34" rx="5" fill="#fef3c7" stroke="#fcd34d"/><text x="245" y="162" text-anchor="middle" fill="#92400e">log</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#w7c)">
    <path d="M68 112 V138"/><path d="M104 112 L232 138"/>
  </g>
  <defs><marker id="w7c" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/></marker></defs>
  <text x="30" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">Crash between them and one happened.</text>
  <text x="30" y="218" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">The order exists and nobody was told,</text>
  <text x="30" y="236" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">or everybody was told about an order</text>
  <text x="30" y="254" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">that does not exist.</text>
  <text x="30" y="280" font-family="system-ui,sans-serif" font-size="11" fill="#334155">Retrying does not fix it. Ordering them</text>
  <text x="30" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#334155">differently does not fix it.</text>

  <line x1="340" y1="46" x2="340" y2="306" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <text x="370" y="62" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#166534">The outbox</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="370" y="76" width="90" height="34" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="415" y="98" text-anchor="middle" fill="#334155">service</text>
    <rect x="370" y="140" width="200" height="60" rx="5" fill="#dcfce7" stroke="#86efac"/>
    <text x="470" y="160" text-anchor="middle" fill="#166534" font-weight="600">one transaction</text>
    <text x="470" y="180" text-anchor="middle" fill="#334155">orders row + outbox row</text>
    <rect x="610" y="140" width="110" height="34" rx="5" fill="#fef3c7" stroke="#fcd34d"/><text x="665" y="162" text-anchor="middle" fill="#92400e">log</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#w7d)">
    <path d="M415 112 V138"/><path d="M572 162 H606"/>
  </g>
  <defs><marker id="w7d" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#16a34a"/></marker></defs>
  <text x="590" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">a relay, separately, at least once</text>

  <text x="370" y="228" font-family="system-ui,sans-serif" font-size="11" fill="#166534">Both rows commit or neither does &#8212; one</text>
  <text x="370" y="246" font-family="system-ui,sans-serif" font-size="11" fill="#166534">database, one transaction, no protocol.</text>
  <text x="370" y="272" font-family="system-ui,sans-serif" font-size="11" fill="#334155">The relay may publish twice. That is fine:</text>
  <text x="370" y="290" font-family="system-ui,sans-serif" font-size="11" fill="#334155">a duplicate is a solved problem, and</text>
  <text x="370" y="308" font-family="system-ui,sans-serif" font-size="11" fill="#334155">a lost event is not.</text>
</svg>
