<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A reader and a writer interleaving so that a stale value is cached indefinitely">
  <rect width="760" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The cache-aside race: a stale value, cached for the full TTL</text>

  <g font-family="system-ui,sans-serif" font-size="11" fill="#475569">
    <text x="30" y="66">reader</text>
    <text x="30" y="150">writer</text>
    <text x="30" y="234">cache</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <path d="M96 60 H720"/><path d="M96 144 H720"/><path d="M96 228 H720"/>
  </g>

  <g font-family="ui-monospace,Menlo,monospace" font-size="10">
    <text x="120" y="52" fill="#2563eb">1. miss, reads db &#8594; x=1</text>
    <text x="330" y="136" fill="#b91c1c">2. writes db x=2</text>
    <text x="330" y="118" fill="#b91c1c">3. deletes cache</text>
    <text x="520" y="52" fill="#2563eb">4. sets cache x=1</text>
  </g>

  <g stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#w6a)">
    <path d="M180 66 V222"/><path d="M560 66 V222"/>
  </g>
  <g stroke="#b91c1c" stroke-width="1.6" fill="none" marker-end="url(#w6b)">
    <path d="M400 138 V222"/>
  </g>
  <defs>
    <marker id="w6a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2563eb"/></marker>
    <marker id="w6b" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#b91c1c"/></marker>
  </defs>

  <rect x="520" y="238" width="180" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="610" y="256" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#991b1b">cache holds x=1</text>

  <text x="40" y="286" font-family="system-ui,sans-serif" font-size="11" fill="#334155">The reader's value was already stale when it wrote it. Every step is correct in isolation, the delete happened, and the</text>
  <text x="40" y="302" font-family="system-ui,sans-serif" font-size="11" fill="#334155">cache is now wrong until the TTL expires. No log anywhere records this.</text>
</svg>
