<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A latency distribution with p50, p99 and the mean marked">
  <rect width="760" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Why the average tells you nothing</text>

  <g stroke="#94a3b8" stroke-width="1.2" fill="none"><path d="M60 240 H720"/><path d="M60 60 V240"/></g>
  <path d="M60 240 C 110 240, 130 90, 175 90 C 220 90, 240 200, 300 218 C 380 234, 430 232, 520 234 C 600 236, 660 238, 700 239 L 700 240 Z" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.6"/>

  <g stroke-dasharray="4 3" stroke-width="1.6">
    <path d="M175 90 V240" stroke="#2563eb"/>
    <path d="M243 60 V240" stroke="#64748b"/>
    <path d="M600 60 V240" stroke="#b91c1c"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="12">
    <text x="175" y="80" text-anchor="middle" fill="#2563eb" font-weight="600">p50 = 35 ms</text>
    <text x="243" y="52" text-anchor="middle" fill="#64748b" font-weight="600">mean = 51 ms</text>
    <text x="600" y="52" text-anchor="middle" fill="#b91c1c" font-weight="600">p99 = 900 ms</text>
    <text x="390" y="262" text-anchor="middle" fill="#64748b" font-size="11">response time</text>
    <text x="618" y="196" fill="#b91c1c" font-size="11">the tail: 1 request in 100,</text>
    <text x="618" y="212" fill="#b91c1c" font-size="11">and it is never random —</text>
    <text x="618" y="228" fill="#b91c1c" font-size="11">it is your best customer</text>
  </g>
  <text x="70" y="278" font-family="system-ui,sans-serif" font-size="11" fill="#334155">The mean sits where almost nobody is. A page that loads 20 times pulls 20 samples from this curve — so &quot;1 in 100&quot; means most sessions hit it.</text>
</svg>
