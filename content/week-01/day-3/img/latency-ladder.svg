<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="A logarithmic ladder of latencies from CPU cache to cross-ocean round trip">
  <rect width="760" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The ladder — each rung is roughly 10x the one below</text>
  <text x="380" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Orders of magnitude, not measurements. The ratios are the part worth carrying around.</text>

  <g font-family="system-ui,sans-serif" font-size="12">
    <g><rect x="40" y="68" width="90" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="85" y="86" text-anchor="middle" fill="#1e3a8a">1 ns</text><text x="150" y="86" fill="#334155">L1 cache reference</text></g>
    <g><rect x="40" y="100" width="120" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="100" y="118" text-anchor="middle" fill="#1e3a8a">100 ns</text><text x="180" y="118" fill="#334155">main memory reference</text></g>
    <g><rect x="40" y="132" width="160" height="26" rx="4" fill="#e0f2fe" stroke="#7dd3fc"/><text x="120" y="150" text-anchor="middle" fill="#075985">10 &#181;s</text><text x="220" y="150" fill="#334155">read 1 MB sequentially from memory</text></g>
    <g><rect x="40" y="164" width="200" height="26" rx="4" fill="#e0f2fe" stroke="#7dd3fc"/><text x="140" y="182" text-anchor="middle" fill="#075985">100 &#181;s</text><text x="260" y="182" fill="#334155">SSD random read</text></g>
    <g><rect x="40" y="196" width="250" height="26" rx="4" fill="#fef3c7" stroke="#fcd34d"/><text x="165" y="214" text-anchor="middle" fill="#92400e">0.5 ms</text><text x="310" y="214" fill="#334155">round trip within one datacentre</text></g>
    <g><rect x="40" y="228" width="320" height="26" rx="4" fill="#fef3c7" stroke="#fcd34d"/><text x="200" y="246" text-anchor="middle" fill="#92400e">10 ms</text><text x="380" y="246" fill="#334155">disk seek &#183; a simple indexed query</text></g>
    <g><rect x="40" y="260" width="420" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="250" y="278" text-anchor="middle" fill="#991b1b">70 ms</text><text x="480" y="278" fill="#334155">London &#8596; New York round trip</text></g>
    <g><rect x="40" y="292" width="520" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="300" y="310" text-anchor="middle" fill="#991b1b">150 ms</text><text x="580" y="310" fill="#334155">London &#8596; Sydney round trip</text></g>
  </g>
</svg>
