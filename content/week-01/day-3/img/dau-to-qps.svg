<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="The chain of arithmetic from daily active users to peak queries per second">
  <rect width="760" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">One chain of arithmetic, six lines long</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#0f172a">
    <text x="40" y="70">10,000,000 DAU</text>
    <text x="40" y="106">x 3 posts read per user per day</text>
    <text x="40" y="142">= 30,000,000 reads / day</text>
    <text x="40" y="178">/ 86,400 s</text>
    <text x="40" y="214">= 350 reads / s   average</text>
    <text x="40" y="250">x 5 peak factor</text>
    <text x="40" y="286">= 1,750 reads / s   peak   <tspan fill="#15803d">← the number you design for</tspan></text>
  </g>

  <g stroke="#cbd5e1" stroke-width="1"><path d="M470 50 V300"/></g>
  <g font-family="system-ui,sans-serif" font-size="11" fill="#64748b">
    <text x="492" y="70">given, or assumed and labelled</text>
    <text x="492" y="106">the number people forget to ask for</text>
    <text x="492" y="142">a day of load</text>
    <text x="492" y="178">seconds in a day. Memorise 86,400.</text>
    <text x="492" y="214">true at 3am, and at no other time</text>
    <text x="492" y="250">measure it if you can; 3–10x if you</text>
    <text x="492" y="266">cannot. Say which you did.</text>
    <text x="492" y="286" fill="#15803d">one significant figure is plenty</text>
  </g>
</svg>
