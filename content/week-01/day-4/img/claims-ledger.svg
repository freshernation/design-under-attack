<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="A claims ledger splitting known, inferred and unknown">
  <rect width="760" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The claims ledger — three columns most write-ups merge into one</text>

  <g font-family="system-ui,sans-serif" font-size="11">
    <g>
      <rect x="28" y="52" width="228" height="180" rx="6" fill="#fff" stroke="#86efac"/>
      <rect x="28" y="52" width="228" height="30" rx="6" fill="#dcfce7" stroke="#86efac"/>
      <text x="42" y="72" font-size="12" font-weight="700" fill="#166534">KNOWN</text>
      <text x="42" y="102" fill="#334155">Stated in the source.</text>
      <text x="42" y="122" fill="#64748b">&quot;Channel Servers are mapped</text>
      <text x="42" y="138" fill="#64748b">to channels by consistent</text>
      <text x="42" y="154" fill="#64748b">hashing&quot;</text>
      <text x="42" y="180" fill="#334155">Carries a source id and a</text>
      <text x="42" y="196" fill="#334155">date. Nothing else goes here.</text>
    </g>
    <g>
      <rect x="266" y="52" width="228" height="180" rx="6" fill="#fff" stroke="#fcd34d"/>
      <rect x="266" y="52" width="228" height="30" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="280" y="72" font-size="12" font-weight="700" fill="#92400e">INFERRED</text>
      <text x="280" y="102" fill="#334155">Your reasoning from it.</text>
      <text x="280" y="122" fill="#64748b">&quot;So adding a host must move</text>
      <text x="280" y="138" fill="#64748b">a slice of channels, and those</text>
      <text x="280" y="154" fill="#64748b">clients must reconnect&quot;</text>
      <text x="280" y="180" fill="#334155">Reasonable. Yours. Never</text>
      <text x="280" y="196" fill="#334155">presented as theirs.</text>
    </g>
    <g>
      <rect x="504" y="52" width="228" height="180" rx="6" fill="#fff" stroke="#fca5a5"/>
      <rect x="504" y="52" width="228" height="30" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="518" y="72" font-size="12" font-weight="700" fill="#991b1b">UNKNOWN</text>
      <text x="518" y="102" fill="#334155">What the source never says.</text>
      <text x="518" y="122" fill="#64748b">&quot;What happens to messages</text>
      <text x="518" y="138" fill="#64748b">sent during the 20 seconds</text>
      <text x="518" y="154" fill="#64748b">a host is replaced?&quot;</text>
      <text x="518" y="180" fill="#334155">Usually the most interesting</text>
      <text x="518" y="196" fill="#334155">column. Always the one cut.</text>
    </g>
  </g>
  <text x="380" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">A write-up that merges these three reads as more authoritative than it is. That is exactly why it reads better.</text>
</svg>
