<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The four source tiers, from primary to folklore">
  <rect width="760" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Four tiers — and only the top two can hold weight</text>

  <g font-family="system-ui,sans-serif" font-size="12">
    <g>
      <rect x="40" y="52" width="500" height="46" rx="6" fill="#dcfce7" stroke="#86efac"/>
      <text x="58" y="72" font-weight="700" fill="#166534">Tier 1 — Primary</text>
      <text x="58" y="90" fill="#334155">the people who run it: their eng blog, their paper, their spec, their talk</text>
      <text x="560" y="80" fill="#166534" font-weight="600">load-bearing</text>
    </g>
    <g>
      <rect x="40" y="106" width="500" height="46" rx="6" fill="#dcfce7" stroke="#86efac"/>
      <text x="58" y="126" font-weight="700" fill="#166534">Tier 2 — Foundational</text>
      <text x="58" y="144" fill="#334155">the paper or official docs it is built on: Raft, Dynamo, Kafka docs</text>
      <text x="560" y="134" fill="#166534" font-weight="600">load-bearing</text>
    </g>
    <g>
      <rect x="40" y="160" width="500" height="46" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="58" y="180" font-weight="700" fill="#92400e">Tier 3 — Secondary</text>
      <text x="58" y="198" fill="#334155">interpretation by others: newsletters, InfoQ, textbooks, this course</text>
      <text x="560" y="188" fill="#92400e">useful, never sole support</text>
    </g>
    <g>
      <rect x="40" y="214" width="500" height="46" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="58" y="234" font-weight="700" fill="#991b1b">Tier 4 — Folklore</text>
      <text x="58" y="252" fill="#334155">repeated everywhere, traceable nowhere</text>
      <text x="560" y="242" fill="#991b1b">a claim about the industry,</text>
      <text x="560" y="258" fill="#991b1b">not about the system</text>
    </g>
  </g>
  <text x="40" y="284" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Most of what you will read about famous architectures is Tier 3 quoting Tier 3. Following a claim down to Tier 1 usually takes two clicks, and often ends nowhere.</text>
</svg>
