<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="The seven passes and what each one produces">
  <rect width="760" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The seven passes — and the artifact each one leaves behind</text>

  <g font-family="system-ui,sans-serif" font-size="12">
    <g>
      <rect x="30" y="50" width="150" height="34" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="44" y="72" fill="#1e3a8a" font-weight="600">1 · Interrogate</text>
      <text x="200" y="72" fill="#334155">requirements, the envelope, the non-goals</text>
    </g>
    <g>
      <rect x="30" y="90" width="150" height="34" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="44" y="112" fill="#1e3a8a" font-weight="600">2 · Size</text>
      <text x="200" y="112" fill="#334155">QPS, bytes, fan-out, working set</text>
    </g>
    <g>
      <rect x="30" y="130" width="150" height="34" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="44" y="152" fill="#1e3a8a" font-weight="600">3 · Contract</text>
      <text x="200" y="152" fill="#334155">the API, the entities, the access patterns</text>
    </g>
    <g>
      <rect x="30" y="170" width="150" height="34" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="44" y="192" fill="#1e3a8a" font-weight="600">4 · Path</text>
      <text x="200" y="192" fill="#334155">the ordered hops of one read and one write</text>
    </g>
    <g>
      <rect x="30" y="210" width="150" height="34" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="44" y="232" fill="#92400e" font-weight="600">5 · Decide</text>
      <text x="200" y="232" fill="#334155">3–5 trade-offs, each with what it rejected</text>
    </g>
    <g>
      <rect x="30" y="250" width="150" height="34" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="44" y="272" fill="#991b1b" font-weight="600">6 · Break</text>
      <text x="200" y="272" fill="#334155">per component: dead, slow, or lying</text>
    </g>
    <g>
      <rect x="30" y="290" width="150" height="34" rx="5" fill="#dcfce7" stroke="#86efac"/>
      <text x="44" y="312" fill="#166534" font-weight="600">7 · Evolve</text>
      <text x="200" y="312" fill="#334155">what breaks first at 10x, and the metric for it</text>
    </g>
  </g>

  <g stroke="#94a3b8" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <path d="M105 84 V90"/><path d="M105 124 V130"/><path d="M105 164 V170"/>
    <path d="M105 204 V210"/><path d="M105 244 V250"/><path d="M105 284 V290"/>
  </g>
  <defs><marker id="a" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/></marker></defs>

  <text x="612" y="72" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">the boring half —</text>
  <text x="612" y="88" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">and where designs</text>
  <text x="612" y="104" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">are actually won</text>
  <text x="612" y="232" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">the part you</text>
  <text x="612" y="248" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">get hired for</text>
</svg>
