<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A query served by an index versus the same query served by a scan">
  <rect width="760" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The same question, asked two ways</text>
  <text x="380" y="50" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#475569">watches where product_id = 42</text>

  <text x="30" y="86" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Keyed by email — a scan</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">
    <rect x="30" y="98" width="320" height="120" rx="5" fill="#fff" stroke="#cbd5e1"/>
    <text x="44" y="118" fill="#94a3b8">ana@…      product 7</text>
    <text x="44" y="136" fill="#94a3b8">bo@…       product 91</text>
    <text x="44" y="154" fill="#0f172a">carla@…    product 42  &#8592;</text>
    <text x="44" y="172" fill="#94a3b8">dan@…      product 3</text>
    <text x="44" y="190" fill="#94a3b8">… 10,000,000 more rows</text>
    <text x="44" y="208" fill="#0f172a">zoe@…      product 42  &#8592;</text>
  </g>
  <text x="30" y="242" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">Every row read to find two.</text>
  <text x="30" y="258" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">Correct, sorted, tidy, and useless.</text>

  <line x1="390" y1="70" x2="390" y2="272" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <text x="418" y="86" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#15803d">Keyed by product_id — a lookup</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">
    <rect x="418" y="98" width="312" height="120" rx="5" fill="#fff" stroke="#cbd5e1"/>
    <text x="432" y="118" fill="#94a3b8">product 3   &#8594; [dan@…]</text>
    <text x="432" y="136" fill="#94a3b8">product 7   &#8594; [ana@…]</text>
    <text x="432" y="154" fill="#0f172a">product 42  &#8594; [carla@…, zoe@…]  &#8592;</text>
    <text x="432" y="172" fill="#94a3b8">product 91  &#8594; [bo@…]</text>
    <text x="432" y="196" fill="#64748b">one seek, one read</text>
  </g>
  <text x="418" y="242" font-family="system-ui,sans-serif" font-size="11" fill="#15803d">The key is the question you ask.</text>
  <text x="418" y="258" font-family="system-ui,sans-serif" font-size="11" fill="#15803d">Choose it from the query, never from the entity.</text>
</svg>
