<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="A write-ahead log with a torn final record, and what recovery does with it">
  <rect width="760" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The log after a crash — and what recovery is allowed to believe</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    <rect x="40" y="58" width="150" height="52" rx="5" fill="#dcfce7" stroke="#86efac"/>
    <text x="54" y="80" fill="#166534">len | crc | rec 1</text>
    <text x="54" y="98" fill="#166534">complete &#10003;</text>

    <rect x="200" y="58" width="150" height="52" rx="5" fill="#dcfce7" stroke="#86efac"/>
    <text x="214" y="80" fill="#166534">len | crc | rec 2</text>
    <text x="214" y="98" fill="#166534">complete &#10003;</text>

    <rect x="360" y="58" width="150" height="52" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="374" y="80" fill="#991b1b">len | crc | rec</text>
    <text x="374" y="98" fill="#991b1b">torn &#8212; power went</text>

    <rect x="520" y="58" width="200" height="52" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-dasharray="4 3"/>
    <text x="534" y="80" fill="#94a3b8">nothing. The write</text>
    <text x="534" y="98" fill="#94a3b8">never happened.</text>
  </g>

  <g font-family="system-ui,sans-serif" font-size="12">
    <rect x="40" y="130" width="680" height="56" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="56" y="152" font-weight="600" fill="#0f172a">Recovery reads forward until a record does not check out, then stops.</text>
    <text x="56" y="174" fill="#334155">Records 1 and 2 are replayed. Record 3 is discarded, and so is anything after it &#8212; even if it looks intact.</text>
  </g>

  <rect x="40" y="200" width="680" height="66" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="56" y="222" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#92400e">Why &quot;and anything after it&quot;</text>
  <text x="56" y="242" font-family="system-ui,sans-serif" font-size="11" fill="#334155">A gap in the middle means you cannot know what was lost. Replaying record 4 without record 3 applies</text>
  <text x="56" y="258" font-family="system-ui,sans-serif" font-size="11" fill="#334155">changes out of order. Stopping at the first bad record is what makes the log a prefix of the truth.</text>
</svg>
