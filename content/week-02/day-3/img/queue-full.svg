<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Four things a bounded queue can do when it is full">
  <rect width="760" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The queue is full. Four choices, and you are making one whether you decide or not</text>

  <g font-family="system-ui,sans-serif" font-size="12">
    <g>
      <rect x="28" y="54" width="345" height="100" rx="6" fill="#fff" stroke="#93c5fd"/>
      <text x="44" y="76" font-weight="700" fill="#1e3a8a">Block the producer</text>
      <text x="44" y="98" fill="#334155">Backpressure. The slowness travels</text>
      <text x="44" y="116" fill="#334155">upstream to whoever can actually stop.</text>
      <text x="44" y="140" fill="#64748b">Right answer inside your own system.</text>
    </g>
    <g>
      <rect x="387" y="54" width="345" height="100" rx="6" fill="#fff" stroke="#fcd34d"/>
      <text x="403" y="76" font-weight="700" fill="#92400e">Reject the new work</text>
      <text x="403" y="98" fill="#334155">A fast, honest 429 or 503. The client</text>
      <text x="403" y="116" fill="#334155">knows now, and can decide what to do.</text>
      <text x="403" y="140" fill="#64748b">Right answer at your edge.</text>
    </g>
    <g>
      <rect x="28" y="166" width="345" height="100" rx="6" fill="#fff" stroke="#fca5a5"/>
      <text x="44" y="188" font-weight="700" fill="#991b1b">Drop the oldest</text>
      <text x="44" y="210" fill="#334155">The item nobody is waiting for any more.</text>
      <text x="44" y="228" fill="#334155">Fresh data beats complete data.</text>
      <text x="44" y="252" fill="#64748b">Right answer for telemetry and feeds.</text>
    </g>
    <g>
      <rect x="387" y="166" width="345" height="100" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="4 3"/>
      <text x="403" y="188" font-weight="700" fill="#991b1b">Grow the queue</text>
      <text x="403" y="210" fill="#334155">The default in most languages, and it is</text>
      <text x="403" y="228" fill="#334155">a choice: slow invisible death instead of</text>
      <text x="403" y="246" fill="#334155">fast visible failure.</text>
      <text x="403" y="266" fill="#64748b">Almost never right. Usually inherited.</text>
    </g>
  </g>
</svg>
