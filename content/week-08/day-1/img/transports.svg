<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Polling, long polling, server-sent events and WebSockets compared">
  <rect width="760" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Four ways to hear about something that has not happened yet</text>

  <g font-family="system-ui,sans-serif" font-size="12">
    <g>
      <rect x="28" y="54" width="704" height="58" rx="6" fill="#fff" stroke="#fca5a5"/>
      <text x="46" y="76" font-weight="700" fill="#991b1b">Polling</text>
      <text x="170" y="76" fill="#334155">ask every N seconds</text>
      <text x="46" y="96" fill="#64748b" font-size="11">Latency up to N. Almost every request returns nothing. Cost scales with clients &#215; frequency, not with events.</text>
      <text x="600" y="76" fill="#991b1b" font-size="11">no connection held</text>
    </g>
    <g>
      <rect x="28" y="122" width="704" height="58" rx="6" fill="#fff" stroke="#fcd34d"/>
      <text x="46" y="144" font-weight="700" fill="#92400e">Long polling</text>
      <text x="170" y="144" fill="#334155">ask, and the server waits to answer</text>
      <text x="46" y="164" fill="#64748b" font-size="11">Near-instant delivery. One held request per client, plus a reconnect after every message and every timeout.</text>
      <text x="600" y="144" fill="#92400e" font-size="11">1 connection per client</text>
    </g>
    <g>
      <rect x="28" y="190" width="704" height="58" rx="6" fill="#fff" stroke="#86efac"/>
      <text x="46" y="212" font-weight="700" fill="#166534">Server-sent events</text>
      <text x="200" y="212" fill="#334155">one long-lived stream, server to client</text>
      <text x="46" y="232" fill="#64748b" font-size="11">Plain HTTP, automatic reconnect, event ids for resumption. One direction only.</text>
      <text x="600" y="212" fill="#166534" font-size="11">1 connection per client</text>
    </g>
    <g>
      <rect x="28" y="258" width="704" height="58" rx="6" fill="#fff" stroke="#93c5fd"/>
      <text x="46" y="280" font-weight="700" fill="#1e3a8a">WebSocket</text>
      <text x="170" y="280" fill="#334155">a two-way connection, upgraded from HTTP</text>
      <text x="46" y="300" fill="#64748b" font-size="11">Both directions, low per-message overhead. You now own reconnection, heartbeats and backpressure yourself.</text>
      <text x="600" y="280" fill="#1e3a8a" font-size="11">1 connection per client</text>
    </g>
  </g>
</svg>
