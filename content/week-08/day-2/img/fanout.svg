<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Fan-out on write versus fan-out on read, and the hybrid">
  <rect width="760" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">The same work, done at a different time</text>

  <text x="30" y="62" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">On write</text>
  <g font-family="system-ui,sans-serif" font-size="11">
    <circle cx="70" cy="104" r="18" fill="#dbeafe" stroke="#93c5fd"/><text x="70" y="108" text-anchor="middle" fill="#1e3a8a">post</text>
  </g>
  <g stroke="#93c5fd" stroke-width="1.2" fill="none">
    <path d="M88 104 L180 74"/><path d="M88 104 L180 92"/><path d="M88 104 L180 110"/><path d="M88 104 L180 128"/><path d="M88 104 L180 146"/>
  </g>
  <g fill="#eff6ff" stroke="#93c5fd">
    <rect x="182" y="64" width="70" height="18" rx="3"/><rect x="182" y="83" width="70" height="18" rx="3"/>
    <rect x="182" y="102" width="70" height="18" rx="3"/><rect x="182" y="121" width="70" height="18" rx="3"/>
    <rect x="182" y="140" width="70" height="18" rx="3"/>
  </g>
  <text x="217" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">one inbox each</text>
  <text x="30" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#166534">Reads are one lookup. Fast, always.</text>
  <text x="30" y="222" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">A post by someone with 200M followers</text>
  <text x="30" y="240" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">is 200M writes from one action.</text>
  <text x="30" y="262" font-family="system-ui,sans-serif" font-size="11" fill="#334155">Storage: one copy per follower.</text>

  <line x1="300" y1="46" x2="300" y2="306" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <text x="330" y="62" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#166534">On read</text>
  <g fill="#dcfce7" stroke="#86efac">
    <rect x="330" y="80" width="60" height="18" rx="3"/><rect x="330" y="102" width="60" height="18" rx="3"/>
    <rect x="330" y="124" width="60" height="18" rx="3"/>
  </g>
  <text x="360" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">who you follow</text>
  <g stroke="#86efac" stroke-width="1.2" fill="none">
    <path d="M392 89 L470 112"/><path d="M392 111 L470 112"/><path d="M392 133 L470 112"/>
  </g>
  <circle cx="492" cy="112" r="22" fill="#dcfce7" stroke="#22c55e"/><text x="492" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#166534">merge</text>
  <text x="330" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#166534">A post is one write, whoever posts it.</text>
  <text x="330" y="222" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">Every read merges N sources, so the</text>
  <text x="330" y="240" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">read is a fan-out and inherits its tail.</text>
  <text x="330" y="262" font-family="system-ui,sans-serif" font-size="11" fill="#334155">Storage: one copy, ever.</text>

  <rect x="330" y="278" width="402" height="34" rx="5" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="346" y="299" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">Hybrid: write for ordinary accounts, read for the few enormous ones. Both, on purpose.</text>
</svg>
