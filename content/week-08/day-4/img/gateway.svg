<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Gateway servers holding connections and channel servers owning conversations">
  <rect width="760" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Two tiers, because connections and conversations scale on different axes</text>

  <g font-family="system-ui,sans-serif" font-size="11">
    <g fill="#f1f5f9" stroke="#cbd5e1">
      <rect x="30" y="70" width="52" height="22" rx="3"/><rect x="30" y="98" width="52" height="22" rx="3"/>
      <rect x="30" y="126" width="52" height="22" rx="3"/><rect x="30" y="154" width="52" height="22" rx="3"/>
      <rect x="30" y="182" width="52" height="22" rx="3"/>
    </g>
    <text x="56" y="222" text-anchor="middle" fill="#64748b">clients</text>
  </g>

  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="150" y="80" width="120" height="46" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="210" y="100" text-anchor="middle" fill="#1e3a8a" font-weight="600">gateway</text>
    <text x="210" y="116" text-anchor="middle" fill="#334155">holds sockets</text>
    <rect x="150" y="140" width="120" height="46" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="210" y="160" text-anchor="middle" fill="#1e3a8a" font-weight="600">gateway</text>
    <text x="210" y="176" text-anchor="middle" fill="#334155">holds sockets</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1" fill="none">
    <path d="M82 81 L148 96"/><path d="M82 109 L148 104"/><path d="M82 137 L148 155"/><path d="M82 165 L148 163"/><path d="M82 193 L148 171"/>
  </g>

  <g font-family="system-ui,sans-serif" font-size="11">
    <rect x="340" y="66" width="150" height="40" rx="5" fill="#dcfce7" stroke="#86efac"/>
    <text x="415" y="90" text-anchor="middle" fill="#166534">channel server 1</text>
    <rect x="340" y="116" width="150" height="40" rx="5" fill="#dcfce7" stroke="#86efac"/>
    <text x="415" y="140" text-anchor="middle" fill="#166534">channel server 2</text>
    <rect x="340" y="166" width="150" height="40" rx="5" fill="#dcfce7" stroke="#86efac"/>
    <text x="415" y="190" text-anchor="middle" fill="#166534">channel server 3</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1" fill="none">
    <path d="M272 100 L336 86"/><path d="M272 104 L336 136"/><path d="M272 160 L336 140"/><path d="M272 164 L336 186"/>
  </g>

  <text x="415" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">channels mapped by consistent hashing</text>

  <rect x="530" y="66" width="200" height="140" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="546" y="88" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Sized differently</text>
  <g font-family="system-ui,sans-serif" font-size="11" fill="#334155">
    <text x="546" y="112">gateways scale with</text>
    <text x="546" y="128" font-weight="600">connected users</text>
    <text x="546" y="152">channel servers scale with</text>
    <text x="546" y="168" font-weight="600">message activity</text>
    <text x="546" y="192" fill="#64748b">one big tier means buying</text>
  </g>
  <text x="546" y="206" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">the wrong resource</text>

  <text x="30" y="256" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">Restart one gateway and every client on it reconnects at once &#8212; at the moment you have less capacity than usual.</text>
  <text x="30" y="274" font-family="system-ui,sans-serif" font-size="11" fill="#334155">Jitter on the reconnect turns a spike into a slope. It is the same fix as a synchronised TTL, and the same rule.</text>
</svg>
