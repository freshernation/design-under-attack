<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A proximity search using cells rather than a distance calculation over every row">
  <rect width="760" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">&quot;Near me&quot; is a key lookup once you stop storing coordinates</text>

  <text x="30" y="62" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Coordinates in a row</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#334155">
    <rect x="30" y="76" width="280" height="120" rx="5" fill="#fff" stroke="#cbd5e1"/>
    <text x="44" y="98">driver_1  51.5074, -0.1278</text>
    <text x="44" y="116">driver_2  40.7128, -74.0060</text>
    <text x="44" y="134">driver_3  51.5075, -0.1281</text>
    <text x="44" y="152">&#8230; 400,000 more</text>
    <text x="44" y="178" fill="#b91c1c">distance() on every row, every query</text>
  </g>
  <text x="30" y="222" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">No index helps: a bounding box on two</text>
  <text x="30" y="240" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">columns still scans one column&#8217;s worth.</text>

  <line x1="352" y1="46" x2="352" y2="276" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <text x="384" y="62" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#15803d">A cell id per row</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#334155">
    <rect x="384" y="76" width="280" height="120" rx="5" fill="#fff" stroke="#cbd5e1"/>
    <text x="398" y="98">cell 8a1f&#8230;  &#8594; [driver_1, driver_3]</text>
    <text x="398" y="116">cell 8a2c&#8230;  &#8594; [driver_9]</text>
    <text x="398" y="134">cell 3b77&#8230;  &#8594; [driver_2]</text>
    <text x="398" y="160" fill="#15803d">one lookup, plus the ring of</text>
    <text x="398" y="178" fill="#15803d">neighbouring cells</text>
  </g>
  <text x="384" y="222" font-family="system-ui,sans-serif" font-size="11" fill="#15803d">A spatial question has become a key</text>
  <text x="384" y="240" font-family="system-ui,sans-serif" font-size="11" fill="#15803d">lookup &#8212; which every store already does.</text>
  <text x="384" y="266" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Cost: the cell is approximate, so you filter afterwards.</text>
</svg>
