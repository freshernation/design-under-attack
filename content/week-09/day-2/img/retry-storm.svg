<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="Retries adding load to an already failing service, and the same retries scattered by jitter">
  <rect width="760" height="310" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">A retry is a new request, arriving when you can least afford one</text>

  <text x="30" y="62" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Retries without jitter</text>
  <g stroke="#94a3b8" stroke-width="1"><path d="M40 200 H340"/></g>
  <g fill="#ef4444">
    <rect x="60" y="150" width="8" height="50"/><rect x="70" y="150" width="8" height="50"/><rect x="80" y="150" width="8" height="50"/>
    <rect x="150" y="120" width="8" height="80"/><rect x="160" y="120" width="8" height="80"/><rect x="170" y="120" width="8" height="80"/><rect x="180" y="120" width="8" height="80"/>
    <rect x="250" y="80" width="8" height="120"/><rect x="260" y="80" width="8" height="120"/><rect x="270" y="80" width="8" height="120"/><rect x="280" y="80" width="8" height="120"/><rect x="290" y="80" width="8" height="120"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="10" fill="#991b1b">
    <text x="74" y="216">first failure</text>
    <text x="150" y="216">retry wave 1</text>
    <text x="250" y="216">retry wave 2</text>
  </g>
  <text x="40" y="248" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">Everyone backs off by the same amount, so</text>
  <text x="40" y="266" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">they all return together &#8212; taller each time.</text>
  <text x="40" y="290" font-family="system-ui,sans-serif" font-size="11" fill="#334155">Backoff alone does not spread anything out.</text>

  <line x1="380" y1="46" x2="380" y2="296" stroke="#cbd5e1" stroke-dasharray="4 4"/>

  <text x="410" y="62" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#15803d">With full jitter</text>
  <g stroke="#94a3b8" stroke-width="1"><path d="M420 200 H720"/></g>
  <g fill="#22c55e">
    <rect x="440" y="176" width="8" height="24"/><rect x="466" y="182" width="8" height="18"/><rect x="492" y="172" width="8" height="28"/>
    <rect x="518" y="180" width="8" height="20"/><rect x="544" y="174" width="8" height="26"/><rect x="570" y="184" width="8" height="16"/>
    <rect x="596" y="178" width="8" height="22"/><rect x="622" y="176" width="8" height="24"/><rect x="648" y="182" width="8" height="18"/>
    <rect x="674" y="174" width="8" height="26"/><rect x="700" y="180" width="8" height="20"/>
  </g>
  <text x="420" y="248" font-family="system-ui,sans-serif" font-size="11" fill="#15803d">The same retries, spread over the same window.</text>
  <text x="420" y="266" font-family="system-ui,sans-serif" font-size="11" fill="#15803d">No wave, no second failure, and the service</text>
  <text x="420" y="284" font-family="system-ui,sans-serif" font-size="11" fill="#15803d">has room to recover.</text>
</svg>
