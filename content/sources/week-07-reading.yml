claims:
  - id: log-retains-after-read
    text: >-
      A log does not delete a record when it is consumed; consumers hold offsets, so many
      consumers can read the same records independently and any of them can replay.
    kind: known
    sources: [kafka-design, kreps-the-log]

  - id: ordering-is-per-partition
    text: >-
      Records are ordered within a partition and have no ordering relationship across
      partitions, so the ordering guarantee is whatever the partition key provides.
    kind: known
    sources: [kafka-design, pubsub-subscriptions]

  - id: consumers-capped-by-partitions
    text: >-
      Each partition is assigned to at most one consumer in a group, so partition count is
      a ceiling on consumer parallelism.
    kind: known
    sources: [kafka-design]

  - id: visibility-timeout
    text: >-
      A received message becomes invisible for a configured period rather than being
      deleted, and reappears if the consumer does not delete it in time.
    kind: known
    sources: [sqs-visibility]

  - id: no-exactly-once-delivery
    text: >-
      Exactly-once delivery is not achievable; what systems provide is at-least-once
      delivery combined with idempotent producers, transactional writes, or idempotent
      effects.
    kind: known
    sources: [kafka-semantics]

  - id: idempotency-key-contract
    text: >-
      An idempotency key is supplied by the client, the stored result is returned on a
      repeat, keys expire after a bounded window, and reuse with a different payload is an
      error rather than a duplicate.
    kind: known
    sources: [stripe-idempotency]

  - id: outbox-pattern
    text: >-
      Writing the state change and the event to the same database in one transaction, then
      relaying the event separately, removes the dual write at the cost of possible
      duplicate publication.
    kind: known
    sources: [debezium-outbox, kleppmann-dual-writes]

  - id: cdc-couples-schema
    text: >-
      Change data capture publishes table changes rather than chosen events, so consumers
      become coupled to the producer's table schema.
    kind: inferred
    sources: [debezium-outbox]
    note: Follows from what CDC emits; the coupling is our framing of the consequence

  - id: replay-is-a-duplicate-source
    text: >-
      Deliberate replay produces duplicates separated by the replay depth, which is
      usually far longer than any accidental redelivery.
    kind: inferred
    sources: [kafka-design, stripe-idempotency]
    note: >-
      The reason the week-7 milestone cannot use a deduplication window for replay. Both
      sources imply it; neither states it as a design constraint.

  - id: recomputation-beats-deduplication
    text: >-
      Recomputing an aggregate from its inputs is idempotent at any replay depth and needs
      no deduplication state, whereas incrementing needs a window as deep as the replay.
    kind: derived
    note: >-
      Arithmetic plus the idempotency of assignment. Worked in the week-7 milestone lab.

  - id: real-duplicate-rates
    text: >-
      What duplicate rates production message systems actually exhibit.
    kind: unknown
    note: Depends entirely on failure rates and consumer behaviour; no general figure exists

  - id: rebalance-durations
    text: >-
      How long a consumer group rebalance takes in practice, and how much throughput it
      costs during a rolling deploy.
    kind: unknown
