claims:
  - id: leases-prevent-stale-sets
    text: >-
      A cache can issue a token on a miss and refuse a set from a client whose token has
      been superseded, which prevents a slow reader caching a value that a later write
      already replaced.
    kind: known
    sources: [fb-memcache-2013]

  - id: leases-prevent-stampedes
    text: >-
      The same token mechanism limits how many clients simultaneously load a missing key
      from the origin.
    kind: known
    sources: [fb-memcache-2013]

  - id: early-recomputation
    text: >-
      Refreshing a cached value probabilistically before it expires, with the probability
      rising as expiry approaches, prevents stampedes without ever serving a miss.
    kind: known
    sources: [cache-stampede-2015]

  - id: stale-while-revalidate
    text: >-
      HTTP allows a cache to serve a stale response while revalidating it in the
      background.
    kind: known
    sources: [rfc-9111, mdn-http-caching]

  - id: s-maxage-is-for-shared-caches
    text: >-
      `s-maxage` applies only to shared caches, allowing a longer lifetime where purging is
      possible than in a browser where it is not.
    kind: known
    sources: [rfc-9111, cloudflare-cache]

  - id: filters-cut-read-amplification
    text: >-
      A per-file membership filter lets a log-structured store skip files that cannot
      contain a key, taking read amplification from the file count to roughly one.
    kind: known
    sources: [rocksdb-overview]

  - id: no-false-negatives
    text: >-
      A bloom filter never reports that a key is absent when it was added; only false
      positives are possible.
    kind: known
    sources: [bloom-1970]

  - id: cache-is-an-unmanaged-replica
    text: >-
      A cache is a replica with no consistency protocol, so every replication question
      from week 5 applies to it.
    kind: inferred
    sources: [fb-memcache-2013]
    note: Our framing. The paper demonstrates it repeatedly without putting it this way

  - id: hit-rate-is-a-capacity-dependency
    text: >-
      Hit rate determines origin load non-linearly, so a small degradation multiplies the
      load on a component sized for a fraction of it.
    kind: inferred
    sources: [fb-memcache-2013]
    note: Arithmetic, plus the paper's account of what happens when a cache tier is lost

  - id: ttl-does-not-help-a-long-tail
    text: >-
      For keys read less often than the TTL, caching absorbs nothing — every read is a
      miss regardless of the TTL.
    kind: derived
    note: >-
      Arithmetic, worked in the week-6 milestone lab. We have found no source that states
      it, which is why the milestone makes students compute it rather than asserting it.

  - id: real-hit-rates
    text: >-
      What hit rates large production caches actually sustain, and how much they degrade
      during an incident.
    kind: unknown

  - id: purge-propagation
    text: >-
      How long a CDN purge takes to reach every edge location.
    kind: unknown
    note: >-
      Varies by provider and is rarely published with a percentile. Check your provider's
      documentation and put their number in your envelope rather than a remembered one.
