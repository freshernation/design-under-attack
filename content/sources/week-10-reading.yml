claims:
  - id: hexagons-uniform-neighbours
    text: >-
      Every neighbour of a hexagonal cell is the same distance away, which squares cannot
      offer, at the cost of hexagons not nesting exactly across resolutions.
    kind: known
    sources: [h3-docs]

  - id: eta-is-post-processing
    text: >-
      Uber's ETA is a routing engine's estimate corrected by a machine-learning model,
      rather than a model predicting arrival time directly.
    kind: known
    sources: [uber-deepeta, deepreta-paper]

  - id: ot-needs-ordering
    text: >-
      Operational transformation rewrites an operation against the operations it did not
      know about, and practical implementations use a central server to establish the
      order against which to transform.
    kind: known
    sources: [wave-ot]

  - id: crdts-converge-without-ordering
    text: >-
      A convergent replicated data type merges commutatively, associatively and
      idempotently, so replicas converge regardless of the order updates arrive in.
    kind: known
    sources: [shapiro-crdts, automerge-docs, yjs-docs]

  - id: single-thread-beats-locks
    text: >-
      Removing concurrency from the matching core made it faster: lock acquisition and
      cross-core cache contention cost more than the matching itself.
    kind: known
    sources: [lmax-disruptor]

  - id: paged-attention
    text: >-
      Serving state per request grows with generated tokens, and allocating it in pages
      rather than reserving the maximum substantially increases the number of concurrent
      requests a given amount of memory supports.
    kind: known
    sources: [vllm-paper]

  - id: continuous-batching
    text: >-
      Refilling a finished batch slot immediately from the queue keeps the accelerator busy
      and raises throughput substantially over running a batch to completion together.
    kind: known
    sources: [vllm-paper, triton-docs]

  - id: federated-roles
    text: >-
      The AT Protocol separates personal data servers, which hold user data, from relays,
      which aggregate their streams, from app views, which build products over the
      aggregate.
    kind: known
    sources: [atproto-overview, bsky-federation]

  - id: convergence-is-not-correctness
    text: >-
      Convergent types guarantee that all replicas reach the same state, not that the state
      reflects either author's intention.
    kind: inferred
    sources: [shapiro-crdts]
    note: >-
      Implied throughout the literature and rarely stated as plainly. Demonstrated as a
      test in the day-2 lab rather than asserted.

  - id: expensive-resource-framing
    text: >-
      A specialised architecture is usually organised around avoiding one expensive
      resource, and identifying that resource explains most of the design.
    kind: inferred
    sources: [lmax-disruptor, netflix-open-connect, vllm-paper]
    note: Our framing across the four domains. Tier 3

  - id: break-even-for-specialisation
    text: >-
      A specialised mechanism has a fixed cost and pays for itself only above a volume that
      can be computed.
    kind: derived
    note: Arithmetic, worked in the week-10 milestone lab

  - id: google-docs-implementation
    text: >-
      What Google Docs actually does today.
    kind: unknown
    note: >-
      The cited ancestor is the Jupiter paper (Nichols et al., 1995), which is not freely
      available, and Google has published almost nothing about the current implementation.
      Anything describing it in detail is inference.

  - id: modern-matching-engines
    text: >-
      What a modern exchange's matching engine looks like.
    kind: unknown
    note: >-
      The Disruptor material is from around 2011 and the domain is secretive. The
      constraints — determinism, sequencing, replay — are the durable part.

  - id: llm-serving-stacks
    text: >-
      How large providers actually serve their own models.
    kind: unknown
    note: >-
      OpenAI publishes infrastructure posts rather than architecture. A good final example
      of the week-1 lesson.
