claims:
  - id: virtual-nodes
    text: >-
      Assigning each physical node many positions on the ring evens out the distribution
      and spreads a departing node's load across the whole cluster rather than onto its
      single clockwise neighbour.
    kind: known
    sources: [dynamo-2007, cassandra-dynamo]

  - id: consistent-hashing-moves-one-nth
    text: >-
      Under consistent hashing, adding or removing a node moves only the keys in that
      node's arc, rather than remapping most of the key space.
    kind: known
    sources: [dynamo-2007, karger-1997]

  - id: bigtable-range-splits
    text: >-
      Bigtable partitions by contiguous row-key ranges, and a range splits when it grows
      too large, so the partitioning adapts to the actual key distribution.
    kind: known
    sources: [bigtable-2006]

  - id: real-load-is-skewed
    text: >-
      Key load in real datacentre applications is imbalanced enough that automatic hot-key
      detection and movement is worth building as a dedicated system.
    kind: known
    sources: [slicer-2016]

  - id: selective-replication
    text: >-
      Making extra copies of the hot items specifically, rather than everything, is an
      effective remedy for read hotspots.
    kind: known
    sources: [tail-at-scale, slicer-2016]

  - id: snowflake-requirements
    text: >-
      Snowflake ids are roughly time-sortable, generated without per-id coordination, and
      compact — those three requirements produce the timestamp/node/sequence layout.
    kind: known
    sources: [snowflake-twitter]

  - id: sortable-means-clustered
    text: >-
      Any time-ordered id scheme puts consecutive writes in adjacent key space, so under
      range partitioning every new write lands on the same partition.
    kind: inferred
    sources: [snowflake-twitter, bigtable-2006]
    note: >-
      Follows directly from both sources but neither states it as a warning. Demonstrated
      in the day-4 lab rather than asserted.

  - id: skew-thresholds
    text: >-
      A skew below about 1.5 is comfortable and above about 3 is a problem.
    kind: inferred
    sources: [slicer-2016]
    note: >-
      Our rule of thumb. No source gives thresholds, and anyone who states them more
      precisely without naming a workload is guessing.

  - id: splitting-versus-ordering
    text: >-
      Splitting a hot key across shards is incompatible with preserving order within that
      key, so a system needing both must weaken one of them.
    kind: inferred
    sources: [slicer-2016, tail-at-scale]
    note: Our framing. It is the whole of the week-4 milestone

  - id: production-skew-figures
    text: >-
      What key skew large multi-tenant platforms actually run at, as a published figure.
    kind: unknown
    note: >-
      Slicer reports imbalance for Google's workloads; nothing general exists, and skew is
      entirely a property of a specific customer base.

  - id: resharding-duration
    text: >-
      How long a live resharding of a large dataset takes, and what it does to latency
      while it runs.
    kind: unknown
