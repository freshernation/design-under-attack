claims:
  - id: idle-is-the-shock-absorber
    text: >-
      Waiting time rises non-linearly with utilisation, so that each step of 5–10
      percentage points near the top of the range roughly doubles the wait.
    kind: known
    sources: [sre-cascading-failures]
    note: The M/M/1 formula is standard queueing theory; the operational framing is Google's

  - id: retries-are-arrivals
    text: >-
      When a service slows, client retries add load exactly when it is least able to
      absorb it, which is what turns a slow service into a failing one.
    kind: known
    sources: [sre-cascading-failures, aws-load-shedding]

  - id: rejecting-is-a-service
    text: >-
      A service that sheds some load and stays up serves its users better than one that
      accepts everything and completes nothing before the client's timeout.
    kind: known
    sources: [aws-load-shedding, sre-handling-overload]

  - id: fanout-inherits-the-tail
    text: >-
      A request that waits on many parallel calls finishes at the slowest of them, so a
      dependency's tail latency becomes the typical latency of the fan-out.
    kind: known
    sources: [tail-at-scale]

  - id: hedged-requests
    text: >-
      Sending a duplicate request to a second replica after a percentile-based delay
      substantially reduces tail latency for a small increase in total load.
    kind: known
    sources: [tail-at-scale]

  - id: cache-raises-variability
    text: >-
      A cache reduces mean service time while making the distribution bimodal, so it can
      increase queueing even as it improves the average.
    kind: inferred
    sources: [tail-at-scale]
    note: >-
      Follows from Kingman's approximation plus the bimodal coefficient of variation,
      both computed in the day-2 lab. No source we found states it in these words.

  - id: peak-factor
    text: >-
      In the absence of a measured peak, 5x the daily average is a reasonable planning
      assumption for single-country consumer traffic.
    kind: inferred
    sources: [sre-handling-overload]

  - id: real-world-utilisation-targets
    text: >-
      What utilisation large services actually target at peak, as a published figure.
    kind: unknown
    note: >-
      Widely repeated as "60–75%" with no traceable source. We use it as a rule of thumb
      and label it as one.

  - id: lifo-in-production
    text: >-
      Which large services actually run LIFO queue discipline under overload, and at
      what threshold they switch.
    kind: unknown
