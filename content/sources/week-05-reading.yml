claims:
  - id: async-loses-acknowledged-writes
    text: >-
      With asynchronous replication, writes the leader has acknowledged can be lost when
      the leader fails and a follower is promoted.
    kind: known
    sources: [dynamo-2007, raft-paper]

  - id: quorum-overlap
    text: >-
      When W + R > N, every read set intersects every write set, so a read sees at least
      one copy of the most recent completed write.
    kind: known
    sources: [dynamo-2007, cassandra-dynamo]

  - id: quorum-is-not-linearizable
    text: >-
      A quorum system satisfying W + R > N is still weaker than linearizable — concurrent
      and partial writes leave cases the overlap says nothing about.
    kind: known
    sources: [jepsen-consistency, dynamo-2007]

  - id: sloppy-quorum-drops-the-guarantee
    text: >-
      A sloppy quorum accepts writes on any reachable nodes, so the overlap guarantee does
      not hold during exactly the failures it was meant to cover.
    kind: known
    sources: [dynamo-2007]

  - id: version-vectors
    text: >-
      Dynamo keeps concurrent versions and returns them to the client for resolution
      rather than picking a winner, because only the application knows what the data means.
    kind: known
    sources: [dynamo-2007]

  - id: majority-prevents-two-leaders
    text: >-
      A node votes at most once per term and a leader needs a majority, so two leaders
      cannot be elected in the same term.
    kind: known
    sources: [raft-paper]

  - id: randomised-timeouts
    text: >-
      Randomising election timeouts is what resolves split votes; without it candidates
      can repeatedly time out together.
    kind: known
    sources: [raft-paper]

  - id: fencing-tokens
    text: >-
      A lock or lease is not sufficient to protect shared storage, because the holder can
      be paused arbitrarily; the storage system must reject writes carrying a superseded
      token.
    kind: known
    sources: [kleppmann-locking, redis-locks]
    note: >-
      Tier 3 by our rule and primary for this argument. Redis's own documentation engages
      with it directly, which is why both are cited.

  - id: session-guarantees-are-cheap
    text: >-
      Read-your-writes and monotonic reads can be provided with a per-client version token
      and do not require consensus or a majority round trip.
    kind: inferred
    sources: [jepsen-consistency]
    note: >-
      The models are defined in the source; the claim that most products need only these
      two, and the cost comparison, is ours.

  - id: check-quorum
    text: >-
      A leader that cannot reach a majority must step down, or it will keep accepting
      writes on the minority side of a partition.
    kind: inferred
    sources: [raft-paper]
    note: >-
      A practical extension rather than part of basic Raft. Widely implemented; the paper
      discusses the need without making it part of the core algorithm.

  - id: real-lease-durations
    text: >-
      What lease durations large systems actually run, and how often spurious expiries
      occur under load.
    kind: unknown

  - id: partition-frequency
    text: >-
      How often network partitions actually occur in production datacentre networks.
    kind: unknown
    note: >-
      Widely asserted as "more often than you think" with no measurement attached. Treat
      any specific frequency you are told with suspicion.
