claims:
  - id: gateway-and-channel-tiers
    text: >-
      Slack separates gateway servers, which hold client connections at the edge, from
      channel servers, which own channels and are mapped to them by consistent hashing.
    kind: known
    sources: [slack-rtm-2023]

  - id: presence-is-a-separate-tier
    text: >-
      Presence is handled by its own tier rather than as a property of the messaging path.
    kind: known
    sources: [slack-rtm-2023]

  - id: broadcast-multiplication
    text: >-
      A single event can produce a large multiple of notifications, because it is
      broadcast to every channel and member that can observe it, and the multiplier varies
      by region.
    kind: known
    sources: [slack-rtm-2023]

  - id: edge-cache-for-connect
    text: >-
      Slack holds the user and channel data a client needs on connect in an edge cache, so
      that connecting does not fan out requests into the core.
    kind: known
    sources: [slack-flannel]

  - id: sse-reconnects-itself
    text: >-
      Server-sent events provide automatic reconnection and resumption from an event id as
      part of the specification.
    kind: known
    sources: [mdn-sse]

  - id: fanout-inherits-the-tail
    text: >-
      A read that merges N sources completes when the slowest of them completes, so its
      typical latency approaches the tail of a single source.
    kind: known
    sources: [tail-at-scale]

  - id: hybrid-fanout
    text: >-
      Large systems fan out on write for ordinary accounts and merge at read time for the
      few very large ones.
    kind: inferred
    sources: [slack-rtm-2023, discord-messages]
    note: >-
      **Tier 3 in substance.** The fan-out taxonomy is standard vocabulary with no
      authoritative source, and we could verify no first-party account of a threshold at
      any large social platform. The arithmetic in the day-2 lab is illustrative.

  - id: store-then-deliver
    text: >-
      Making messages durable with a per-conversation sequence, and treating push as an
      optimisation, removes the need for per-device queues and delivery guarantees on the
      push path.
    kind: inferred
    sources: [whatsapp-scaling, slack-rtm-2023]
    note: Our framing of an approach visible in how both systems behave

  - id: reconnect-storms
    text: >-
      Restarting a host holding many long-lived connections produces a simultaneous
      reconnect wave whose rate can exceed the tier's accept capacity.
    kind: derived
    note: >-
      Arithmetic. Discord's post describes reconnection load at scale; the specific rates
      in the week-8 lab are ours.

  - id: real-fanout-thresholds
    text: >-
      What follower or member count large platforms actually use as a fan-out threshold.
    kind: unknown
    note: Not published by any platform we could find. Treat any specific figure as folklore.

  - id: per-connection-memory
    text: >-
      How much memory a connection actually costs in a given runtime.
    kind: unknown
    note: >-
      Varies by an order of magnitude between runtimes. We deliberately quote no figure;
      measure yours.
