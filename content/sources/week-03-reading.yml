claims:
  - id: access-patterns-decide
    text: >-
      Dynamo's design was driven by Amazon's query patterns — primary-key access to small
      objects — rather than by the shape of the data, and that is what justified dropping
      relational querying.
    kind: known
    sources: [dynamo-2007]

  - id: row-key-is-the-index
    text: >-
      Bigtable maintains data in lexicographic order by row key, and the row key is the
      only ordering available, so the choice of row key determines which queries are cheap.
    kind: known
    sources: [bigtable-2006]

  - id: lsm-shape
    text: >-
      A log-structured store buffers writes in a sorted in-memory table, flushes it as an
      immutable sorted file, and merges those files in the background.
    kind: known
    sources: [leveldb-impl, rocksdb-overview, bigtable-2006, lsm-tree-1996]

  - id: deletes-are-tombstones
    text: >-
      A delete in a log-structured store writes a marker rather than removing data, and
      the space is reclaimed only when compaction merges the marker with the older value.
    kind: known
    sources: [leveldb-impl, rocksdb-overview]

  - id: rum-tradeoff
    text: >-
      Read, update and memory overheads cannot all be minimised simultaneously; improving
      two worsens the third.
    kind: known
    sources: [rum-conjecture]

  - id: leveled-vs-tiered
    text: >-
      Leveled compaction gives lower read and space amplification at the cost of higher
      write amplification; tiered compaction makes the opposite trade.
    kind: known
    sources: [rocksdb-leveled, rum-conjecture]

  - id: wal-before-page
    text: >-
      Changes are appended to a sequential log and made durable there before the
      corresponding data pages are written, so a crash leaves a replayable log rather
      than a half-written structure.
    kind: known
    sources: [postgres-wal, sqlite-atomic-commit]

  - id: compaction-is-a-variability-problem
    text: >-
      Compaction bursts are service-time spikes, so they raise the p99 by more than the
      extra work alone accounts for, via the queueing effect of increased variance.
    kind: inferred
    sources: [rocksdb-leveled]
    note: >-
      Our synthesis of week 2's Kingman material with RocksDB's description of compaction.
      No source we found states it in these terms.

  - id: our-amplification-formulas
    text: >-
      The amplification formulas in the day-2 lab (levels x size ratio, page over row)
      are simplified models, not measurements.
    kind: inferred
    sources: [rocksdb-leveled]
    note: Stated as such in the lab docstring and in the article. Do not quote them as fact.

  - id: real-amplification-numbers
    text: >-
      What write amplification a given engine actually exhibits under a given workload.
    kind: unknown
    note: >-
      Depends on key distribution, config and hardware. Published figures vary by an
      order of magnitude and are rarely accompanied by the workload that produced them.

  - id: tombstone-drop-timing
    text: >-
      When production engines actually drop tombstones, in wall-clock terms, for a
      given delete rate.
    kind: unknown
